name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Verify module
        run: |
          go mod verify
          go vet ./...
      - name: Test
        run: go test ./...

  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Race tests
        run: go test -race ./...

  fuse-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: FUSE gate (present once M3-01 lands)
        run: |
          if [ -d internal/fusefs ]; then
            go test -run TestFUSE -count=1 ./internal/fusefs/...
          else
            echo "M3-01 not landed; skipping FUSE suite (no internal/fusefs yet)"
          fi

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Diff check
        run: git diff --check
