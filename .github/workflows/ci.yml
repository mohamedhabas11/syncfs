name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Verify module
        run: |
          go mod verify
          go vet ./...
          go build ./...
      - name: Format check
        run: |
          files=$(gofmt -l -s .)
          if [ -n "$files" ]; then
            echo "gofmt -l -s found files:"
            echo "$files"
            exit 1
          fi
      - name: Test
        run: go test ./...

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - name: Buf lint
        run: buf lint
      - name: Buf breaking
        run: buf breaking --against api/baseline

  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Race tests
        run: go test -race ./...

  fuse-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: FUSE gate (required; /dev/fuse must be present)
        run: go test -run TestFUSE -count=1 ./internal/fusefs/...

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Diff check
        run: git diff --check
