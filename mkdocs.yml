site_name: SyncFS
site_description: Linux-only replicated POSIX shared-directory service for small HA deployments.
repo_url: https://github.com/mohamedhabas11/syncfs
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
plugins:
  - search
theme:
  name: material
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Development: development.md
  - Architecture:
    - Overview: architecture/index.md
    - Write path: architecture/write-path.md
    - Read and lease: architecture/read-and-lease.md
    - Membership and bootstrap: architecture/membership-and-bootstrap.md
    - Storage: architecture/storage.md
    - Transport: architecture/transport.md
  - Operating model: operating-model.md
  - Failure semantics: failure-semantics.md
  - POSIX compatibility: posix-compat.md
  - Compatibility profile: compatibility.md
  - Known limitations: known-limitations.md
  - Status: spec/status.md
  - Security: security.md
  - ADRs:
    - Index: adr/index.md
    - 0001 M5 deferral: adr/0001-defer-m5-qualification.md
    - 0002 M3-01 completion: adr/0002-m3-01-strict-mount-completion.md
    - 0003 Joint promotion: adr/0003-joint-promotion-durable-journal-cli.md
  - Benchmarks:
    - Methodology: benchmarks/README.md
  - Releases:
    - v0.1.0: releases/v0.1.0.md
  - Reference:
    - CLI and config: reference/cli.md
    - Config: reference/config.md
    - API/proto: reference/api.md
