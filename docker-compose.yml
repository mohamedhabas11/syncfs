# SyncFS 3-node dev fleet (control + data plane testing ground).
# Each service is a storage-node sandbox. CODE is shared read-only at /src;
# DATA is NOT shared: each node owns a private writable volume /var/lib/syncfs
# (independent failure domain, like a real deployment — quorum, corruption,
# and repair tests are meaningless without it).
# Go module/build caches are shared volumes so iterations stay fast.
# The base image (Dockerfile) is golang:1.26-alpine + fusermount so M3+
# FUSE-mount tests can use /dev/fuse (exposed to every node below).
#
# Build the image:   docker compose build
# Test a node:       docker compose run --rm node-a go test ./... -count=1 -race
# FUSE tests:        /dev/fuse routed via devices: + SYS_ADMIN, fusermount present.
#                    Mount tests need the fusermount binary at runtime (present).

services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /src
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    volumes:
      - .:/src:ro
      - node-a-data:/var/lib/syncfs
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache
    command: go test ./... -count=1 -race

  node-b:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /src
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    volumes:
      - .:/src:ro
      - node-b-data:/var/lib/syncfs
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache
    command: go test ./... -count=1 -race

  node-c:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /src
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    volumes:
      - .:/src:ro
      - node-c-data:/var/lib/syncfs
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache
    command: go test ./... -count=1 -race

volumes:
  node-a-data:
  node-b-data:
  node-c-data:
  go-mod-cache:
  go-build-cache:
